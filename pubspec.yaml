name: unisism_paciente
description: "UNISISM - App do Paciente. Acompanhamento de encaminhamentos, dossie medico, TFD e notificacoes da Secretaria de Saude."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Storage / persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Auth & forms
  mask_text_input_formatter: ^2.9.0

  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Files & sharing
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # UI utilities
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

  # Date / i18n
  intl: ^0.20.1
  timeago: ^3.7.0

  # Logging
  logger: ^2.5.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # Functional helpers
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^3.0.6
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
